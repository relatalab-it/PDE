<style>
/* Layout del template di milano-evoluzione: sidebar sinistra con l'elenco delle viste, mappa al centro, pannello a destra. Una vista alla volta. */

}

.frame { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(100%, calc(var(--sh) * var(--arn))); max-height: 100%; aspect-ratio: var(--arn); overflow: hidden; touch-action: none; cursor: grab; user-select: none; }

.psec:last-child { border-bottom: 0; }

button { font-family: var(--body); }

.tag.rndt { border-color: var(--ok); color: var(--ok); } .tag.non { border-color: var(--warn); color: var(--warn); } .tag.prog { border-color: var(--ko); color: var(--ko); }
.item .sid { font-family: var(--mono); font-size: 14.5px; color: var(--muted); }
.item.off { opacity: .55; }
.info { font-size: var(--fs-caption); display: grid; gap: 3px; border-top: 1px dotted var(--line); padding-top: 6px; }
.info .r { display: grid; grid-template-columns: 7.5em 1fr; gap: 8px; }

.avviso.k { border-left-color: var(--ko); } .avviso.i { border-left-color: var(--muted); }
details.grp { border: 1px solid var(--line); border-radius: 5px; }
details.grp > summary { cursor: pointer; padding: 8px 10px; font: 600 var(--fs-small)/1.2 var(--body); }
details.grp > div { padding: 0 8px 8px; display: grid; gap: 6px; }
table { border-collapse: collapse; width: 100%; font-size: var(--fs-caption); }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }

.tbl-wrap { overflow-x: auto; }

.method { max-width: 1100px; }
.method ul { margin: 0 0 10px; padding-left: 22px; max-width: 74ch; } .method li { margin-bottom: 5px; }
@media (max-width: 1100px) { .workspace { grid-template-columns: minmax(0, 1fr); } .panel { position: static; max-height: none; } .stage { --sh: clamp(320px, 66vh, 760px); } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px; gap: 10px; }
  .nav { flex-direction: row; overflow-x: auto; } .nav button { flex: none; border-left: 0; border-bottom: 3px solid transparent; } .nav button[aria-current="page"] { border-bottom-color: var(--accent); }
  .side .foot { display: none; } main { padding: 16px 14px 40px; }
}

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n).toLocaleString('it-IT');
const kb = b => b >= 1e6 ? (b / 1e6).toLocaleString('it-IT', { maximumFractionDigits: 1 }) + ' MB' : Math.max(1, Math.round(b / 1000)).toLocaleString('it-IT') + ' KB';      // MB e KB decimali
const MAX_ATTIVI = 6;
let M, byId = {}, serieDi = {}, vistaCorrente = 'v1', S = {};   // S[vista] = { att: [{k, op, per}], sfondo }
let legende = {};

/* ---------- dati ---------- */
const stratoDi = (k, per) => k.startsWith('S:') ? M.strati.find(s => s.serie && s.serie.id === k.slice(2) && s.serie.etichetta === per) : byId[k];
const titoloSerie = id => (M.serie_titoli && M.serie_titoli[id]) ||
  serieDi[id][0].titolo.replace(/\s*[—-]?\s*\(?(al 31\/12\/)?\d{4}([–-]\d{4})?\)?/g, '').replace(/\s{2,}/g, ' ').replace(/[—\s]+$/g, '').trim();
const anni = a => { const m = String(a ?? '').match(/\d{4}/g); return m ? [Math.min(...m), Math.max(...m)] : null; };
const ok = s => s.rendering && s.rendering.esito === 'ok';
const chiave = s => s.serie ? 'S:' + s.serie.id : s.id;
function voci(ids) {   // elenco di voci (strati singoli o serie) senza duplicati, nell'ordine del manifesto
  const out = [], visti = new Set();
  for (const id of ids) { const s = byId[id]; const k = chiave(s); if (!visti.has(k)) { visti.add(k); out.push(k); } }
  return out;
}
const periodi = k => serieDi[k.slice(2)].map(s => s.serie.etichetta);
function statoVista(v) {
  if (!S[v.id]) {
    const att = (v.attivi || []).map(id => byId[id]).filter(s => s && ok(s)).map(s => ({ k: chiave(s), op: 85, per: s.serie ? s.serie.etichetta : null }));
    S[v.id] = { att, sfondo: 'osm', opsf: 60 };
  }
  return S[v.id];
}

/* ---------- avvisi di lettura (calcolati dal manifesto) ---------- */
const nomeAv = s => `<b>${esc(s.id)}</b>`;
function avvisiStrato(s) {
  const out = [], nome = nomeAv;
  {
    if (s.anno_fonte === 'revisione') out.push(['', `${nome(s)}: l'anno ${esc(s.anno)} è la data di revisione della scheda, non l'anno del dato.`]);
    if (s.programmato) out.push(['k', `${nome(s)}: istantanea futura, dato di programma e non realizzato.`]);
    if (s.dpi) out.push(['i', `${nome(s)}: visibile solo a scala ${esc(s.scala_limite)} o più fine; qui è reso con dpi ridotti, i simboli sono molto piccoli.`]);
    if (s.fonte !== 'RNDT') out.push(['i', `${nome(s)}: fonte «non RNDT» (catalogo del Comune); licenza: ${esc(s.licenza)}.`]);
    else if (/non dichiarata/i.test(s.licenza)) out.push(['i', `${nome(s)}: licenza non dichiarata.`]);
  }
  return out;
}
function avvisiCoppie(A) {
  const out = [], nome = nomeAv;
  for (let i = 0; i < A.length; i++) for (let j = i + 1; j < A.length; j++) {
    const a = A[i], b = A[j], ya = anni(a.anno), yb = anni(b.anno);
    if (ya && yb) {
      const gap = Math.max(ya[0] - yb[1], yb[0] - ya[1], 0);
      if (gap > 3) out.push(['', `Anni distanti: ${nome(a)} (${esc(a.anno)}) e ${nome(b)} (${esc(b.anno)}), ${gap} anni.`]);
    }
    const sa = parseInt(String(a.scala || '').replace(/\D/g, '')), sb = parseInt(String(b.scala || '').replace(/\D/g, ''));
    if (a.tipo !== 'vettore' && b.tipo !== 'vettore' && sa && sb && Math.max(sa, sb) / Math.min(sa, sb) >= 5) out.push(['', `Scale molto diverse: ${nome(a)} (${esc(a.scala)}) e ${nome(b)} (${esc(b.scala)}).`]);
  }
  if (A.length > 1) out.push(['i', 'Sovrapporre non significa correlare: gli strati sono ricampionati a ' + M.riquadro.m_per_pixel + ' m e riproiettati in ' + esc(M.riquadro.crs) + '.']);
  return out;
}
function avvisi(att) {
  const A = att.map(a => stratoDi(a.k, a.per)).filter(Boolean);
  return [...A.flatMap(avvisiStrato), ...avvisiCoppie(A)];
}

/* ---------- mappa: pan e zoom sul riquadro comune ---------- */
const mp = { z: 1, x: 0, y: 0 };
const ZOOM_MAX = 96;
let ultimaCoord = '';
function testoZoom() {
  const fr = $('frame'); if (!fr) return '';
  const mpx = (M.riquadro.bbox[2] - M.riquadro.bbox[0]) / (fr.getBoundingClientRect().width * mp.z);
  return `ZOOM ${mp.z.toLocaleString('it-IT', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}× · 1 px = ${mpx.toLocaleString('it-IT', { maximumFractionDigits: mpx >= 10 ? 0 : 1 })} m`;
}
function aggiornaReadout() { const r = $('readout'); if (r) r.textContent = (ultimaCoord ? ultimaCoord + '   ' : '') + testoZoom(); }
function applyPlane() { const p = $('plane'); if (p) p.style.transform = `translate(${mp.x}px,${mp.y}px) scale(${mp.z})`; aggiornaReadout(); sincronizzaOsm(); pianificaVettori(); pianificaTessere(); aggiornaHash(); }

function zoomAt(f, cx, cy) {
  const fr = $('frame').getBoundingClientRect(), nz = Math.min(ZOOM_MAX, Math.max(1, mp.z * f)), k = nz / mp.z;
  const px = cx ?? fr.width / 2, py = cy ?? fr.height / 2;
  mp.x = px - (px - mp.x) * k; mp.y = py - (py - mp.y) * k; mp.z = nz; clamp(); applyPlane();
}
function clamp() { const fr = $('frame').getBoundingClientRect(); mp.x = Math.min(0, Math.max(fr.width * (1 - mp.z), mp.x)); mp.y = Math.min(0, Math.max(fr.height * (1 - mp.z), mp.y)); }
function initMap() {
  const f = $('frame'); let drag = null;
  f.addEventListener('wheel', e => { e.preventDefault(); const r = f.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.25 : 0.8, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  f.addEventListener('pointerdown', e => { drag = { x: e.clientX - mp.x, y: e.clientY - mp.y }; f.setPointerCapture(e.pointerId); f.classList.add('dragging'); });
  f.addEventListener('pointermove', e => {
    const r = f.getBoundingClientRect(), B = M.riquadro.bbox;
    const u = (e.clientX - r.left - mp.x) / (r.width * mp.z), v = (e.clientY - r.top - mp.y) / (r.height * mp.z);
    if (u >= 0 && u <= 1 && v >= 0 && v <= 1) { ultimaCoord = `E ${fmt(Math.round(B[0] + u * (B[2] - B[0])))}  N ${fmt(Math.round(B[3] - v * (B[3] - B[1])))}  (${M.riquadro.crs})`; aggiornaReadout(); }
    if (drag) { mp.x = e.clientX - drag.x; mp.y = e.clientY - drag.y; clamp(); applyPlane(); }
  });
  const end = () => { drag = null; f.classList.remove('dragging'); };
  f.addEventListener('pointerup', end); f.addEventListener('pointercancel', end);
  $('zin').onclick = () => zoomAt(1.5); $('zout').onclick = () => zoomAt(1 / 1.5); $('zres').onclick = () => { mp.z = 1; mp.x = mp.y = 0; applyPlane(); };
}
/* ---------- strati vettoriali (vettori/<id>.json, vedi vettori.md): punti, linee e poligoni scaricati in locale e disegnati in un canvas a ogni zoom e
   spostamento: nitidi a qualsiasi scala, con stile del servizio (classi) e ritocchi del manifesto (`stile`) ---------- */
const VET = {};
const rgba = (c, k = 0) => c ? `rgba(${Math.round(c[0] + (255 - c[0]) * k)},${Math.round(c[1] + (255 - c[1]) * k)},${Math.round(c[2] + (255 - c[2]) * k)},${(c[3] === undefined ? 255 : c[3]) / 255})` : null;
function caricaVettore(s) {
  if (VET[s.id]) return VET[s.id].pronto;
  const v = VET[s.id] = { gruppi: [], n: 0 };
  // Un solo Path2D con centinaia di migliaia di vertici si costruisce in modo più che proporzionale (80 s per 909.000 vertici): pezzi da 1.000
  // elementi, costruiti a blocchi cedendo il controllo al browser e disegnati man mano che sono pronti.
  v.pronto = fetch(s.rendering.file).then(r => r.json()).then(async d => {
    const PEZZO = 1000, BLOCCO = 4; let nb = 0;
    v.geom = d.geom; v.classi = d.classi; v.n = d.classi.reduce((a, c) => a + c.n, 0);
    for (const c of v.classi) if (c.stile && c.stile.icona) { c.img = new Image(); c.img.src = `data:${c.stile.tipo_icona || 'image/png'};base64,${c.stile.icona}`; }
    for (const [ci, g] of d.dati) {
      if (d.geom === 'point') {
        const n = g.length / 2, xs = new Int32Array(n), ys = new Int32Array(n); let x = g[0], y = g[1]; xs[0] = x; ys[0] = y;
        for (let i = 1; i < n; i++) { x += g[2 * i]; y += g[2 * i + 1]; xs[i] = x; ys[i] = y; }
        v.gruppi.push({ ci, xs, ys });
        continue;
      }
      for (let i = 0; i < g.length; i += PEZZO) {
        const path = new Path2D(), chiuso = d.geom === 'poly';      // coordinate intere in decimetri dall'angolo in alto a sinistra del riquadro
        for (const f of g.slice(i, i + PEZZO)) for (const a of f) {
          let x = a[0], y = a[1]; path.moveTo(x, y);
          for (let k = 2; k < a.length; k += 2) { x += a[k]; y += a[k + 1]; path.lineTo(x, y); }
          if (chiuso) path.closePath();
        }
        v.gruppi.push({ ci, path });

/* ---------- routing: l'indirizzo descrive lo stato. #/<vista|catalogo>?s=<strati>&bg=<sfondo>&z=<zoom>&c=<E,N>&q=&f=&l=&i=<strato aperto>
